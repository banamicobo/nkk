<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historia pojazdu · NKK</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<style>
.timeline{position:relative;padding-left:32px}
.timeline::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--border)}
.tl-item{position:relative;margin-bottom:20px}
.tl-dot{position:absolute;left:-26px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 0 2px var(--accent)}
.tl-dot.service{background:var(--blue)}
.tl-dot.service{box-shadow:0 0 0 2px var(--blue)}
.tl-dot.repair{background:var(--red)}
.tl-dot.repair{box-shadow:0 0 0 2px var(--red)}
.tl-dot.note{background:var(--text3)}
.tl-dot.note{box-shadow:0 0 0 2px var(--text3)}
.tl-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px}
.tl-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.tl-title{font-size:13px;font-weight:600}
.tl-meta{font-size:12px;color:var(--text3)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);padding:28px;width:420px;max-width:95vw}
.modal h3{font-size:15px;font-weight:700;margin-bottom:18px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🚐</div>
      <div class="logo-name">Nasz Kochany Kamper</div>
      <div class="logo-sub">Spółdzielnia</div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">⊞</span> Dashboard</a>
      <a href="reservations.html" class="nav-item"><span class="nav-icon">📅</span> Rezerwacje</a>
      <a href="balance.html" class="nav-item"><span class="nav-icon">⚖</span> Bilans</a>
      <a href="documents.html" class="nav-item"><span class="nav-icon">📄</span> Dokumenty</a>
      <a href="history.html" class="nav-item active"><span class="nav-icon">🔧</span> Historia pojazdu</a>
      <a href="members.html" class="nav-item"><span class="nav-icon">👥</span> Członkowie</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebar-user"></div>
      <a href="#" class="nav-item" onclick="logout()"><span class="nav-icon">↩</span> Wyloguj</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <span class="topbar-title">Historia pojazdu</span>
      <button class="btn btn-primary btn-sm" onclick="openModal()">+ Dodaj wpis</button>
    </div>
    <div class="page-content">

      <!-- FILTER -->
      <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm active-filter" onclick="setFilter('',this)">Wszystkie</button>
        <button class="btn btn-ghost btn-sm" onclick="setFilter('service',this)">🔧 Serwis</button>
        <button class="btn btn-ghost btn-sm" onclick="setFilter('repair',this)">🛠 Naprawa</button>
        <button class="btn btn-ghost btn-sm" onclick="setFilter('tires',this)">🔄 Opony</button>
        <button class="btn btn-ghost btn-sm" onclick="setFilter('note',this)">📝 Notatka</button>
      </div>

      <div class="grid-2">
        <!-- TIMELINE -->
        <div style="grid-column:1/3">
          <div class="timeline" id="timeline">
            <div style="color:var(--text3);font-size:13px">Ładowanie…</div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>Dodaj wpis do historii</h3>
    <div id="modal-alert"></div>
    <div class="form-group">
      <label>Typ wpisu</label>
      <select id="entry-type">
        <option value="service">🔧 Serwis</option>
        <option value="repair">🛠 Naprawa</option>
        <option value="tires">🔄 Opony</option>
        <option value="inspection">📋 Przegląd</option>
        <option value="note">📝 Notatka</option>
        <option value="purchase">💰 Zakup</option>
      </select>
    </div>
    <div class="form-group">
      <label>Tytuł</label>
      <input type="text" id="entry-title" placeholder="Np. Wymiana oleju + filtrów">
    </div>
    <div class="form-group">
      <label>Opis (opcjonalnie)</label>
      <textarea id="entry-desc" placeholder="Szczegóły, uwagi, przebieg…"></textarea>
    </div>
    <div class="form-group">
      <label>Data</label>
      <input type="date" id="entry-date">
    </div>
    <div class="form-group">
      <label>Przebieg (km)</label>
      <input type="number" id="entry-km" placeholder="Np. 45000">
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Anuluj</button>
      <button class="btn btn-primary" onclick="submitEntry()">Zapisz</button>
    </div>
  </div>
</div>

<script>
let allEntries = [];
let currentFilter = '';
let currentMember = null;

const TYPE_ICON = { service:'🔧', repair:'🛠', tires:'🔄', inspection:'📋', note:'📝', purchase:'💰' };
const TYPE_LABEL = { service:'Serwis', repair:'Naprawa', tires:'Opony', inspection:'Przegląd', note:'Notatka', purchase:'Zakup' };

async function init() {
  const session = await requireAuth();
  if (!session) return;
  currentMember = await getCurrentMember(session.user.id);
  renderSidebarUser(currentMember);
  document.getElementById('entry-date').value = new Date().toISOString().slice(0,10);
  await loadHistory();
}

async function loadHistory() {
  const { data } = await _supabase.from('vehicle_history')
    .select('*, members(name)')
    .order('date', { ascending: false });
  allEntries = data || [];
  renderTimeline();
}

function renderTimeline() {
  const filtered = currentFilter ? allEntries.filter(e => e.type === currentFilter) : allEntries;
  const el = document.getElementById('timeline');
  if (!filtered.length) { el.innerHTML = '<div style="color:var(--text3);font-size:13px">Brak wpisów.</div>'; return; }

  let lastYear = null;
  el.innerHTML = filtered.map(e => {
    const yr = new Date(e.date).getFullYear();
    const yearSep = yr !== lastYear ? `<div style="font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px;margin-top:${lastYear?'8px':'0'}">${yr}</div>` : '';
    lastYear = yr;
    return `
    ${yearSep}
    <div class="tl-item">
      <div class="tl-dot ${e.type}"></div>
      <div class="tl-card">
        <div class="tl-header">
          <div class="tl-title">${TYPE_ICON[e.type]||'📋'} ${escHtml(e.title)}</div>
          <span class="badge badge-gray">${TYPE_LABEL[e.type]||e.type}</span>
        </div>
        <div class="tl-meta">
          ${formatDate(e.date)}${e.mileage ? ` · ${e.mileage.toLocaleString('pl-PL')} km` : ''} · ${e.members?.name||''}
        </div>
        ${e.description ? `<div style="font-size:12px;color:var(--text2);margin-top:6px">${escHtml(e.description)}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.active-filter').forEach(b => {
    b.classList.remove('active-filter');
    b.style.background = ''; b.style.color = '';
  });
  btn.classList.add('active-filter');
  btn.style.background = 'var(--accent-dim)'; btn.style.color = 'var(--accent)';
  renderTimeline();
}

function openModal() { document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }

async function submitEntry() {
  const title = document.getElementById('entry-title').value.trim();
  const type = document.getElementById('entry-type').value;
  const desc = document.getElementById('entry-desc').value.trim();
  const date = document.getElementById('entry-date').value;
  const km = document.getElementById('entry-km').value;
  const alertEl = document.getElementById('modal-alert');

  if (!title || !date) { alertEl.innerHTML = '<div class="alert alert-danger">Wypełnij tytuł i datę.</div>'; return; }

  const { error } = await _supabase.from('vehicle_history').insert({
    member_id: currentMember.id, type, title, description: desc, date,
    mileage: km ? parseInt(km) : null
  });
  if (error) { alertEl.innerHTML = `<div class="alert alert-danger">${error.message}</div>`; return; }

  closeModal();
  await loadHistory();
}

function formatDate(d) {
  return new Date(d).toLocaleDateString('pl-PL', { day: 'numeric', month: 'long', year: 'numeric' });
}
function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

init();
</script>
</body>
</html>
