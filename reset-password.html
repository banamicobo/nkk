<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nowe hasło · NKK</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<style>
.reset-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.reset-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px;
  width: 100%;
  max-width: 400px;
  box-shadow: var(--shadow);
  position: relative;
  z-index: 1;
}
.reset-box::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(232,131,42,.06) 0%, transparent 60%);
  pointer-events: none;
}
.reset-logo {
  text-align: center;
  margin-bottom: 28px;
}
.reset-logo .icon { font-size: 32px; margin-bottom: 8px; }
.reset-logo h2 {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--cream);
  margin-bottom: 6px;
}
.reset-logo p { font-size: 13px; color: var(--text3); }
</style>
</head>
<body>
<div class="reset-wrap">
  <div class="reset-box">
    <div class="reset-logo">
      <div class="icon">🚐</div>
      <h2>Ustaw nowe hasło</h2>
      <p>Wpisz nowe hasło do swojego konta NKK.</p>
    </div>

    <div id="page-alert"></div>

    <div id="form-area">
      <div class="form-group">
        <label>Nowe hasło</label>
        <input type="password" id="new-pass" placeholder="Min. 6 znaków" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>Powtórz hasło</label>
        <input type="password" id="new-pass2" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button class="btn btn-primary" id="save-btn" onclick="savePassword()" style="width:100%;justify-content:center;padding:11px;font-size:14px;">
        Zapisz nowe hasło →
      </button>
    </div>
  </div>
</div>

<script>
// Supabase odbiera token z URL hash automatycznie przy inicjalizacji
// Sprawdzamy czy sesja jest aktywna (token z linku resetującego)
(async () => {
  const alertEl = document.getElementById('page-alert');
  const { data: { session } } = await _supabase.auth.getSession();
  if (!session) {
    document.getElementById('form-area').style.display = 'none';
    alertEl.innerHTML = `<div class="alert alert-danger" style="margin-bottom:20px">
      Link wygasł lub jest nieprawidłowy. <a href="index.html" style="color:var(--orange2)">Wróć i spróbuj ponownie.</a>
    </div>`;
  }
})();

document.getElementById('new-pass2').addEventListener('keydown', e => {
  if (e.key === 'Enter') savePassword();
});

async function savePassword() {
  const alertEl = document.getElementById('page-alert');
  const btn = document.getElementById('save-btn');
  const pass  = document.getElementById('new-pass').value;
  const pass2 = document.getElementById('new-pass2').value;

  if (!pass || pass.length < 6) {
    alertEl.innerHTML = err('Hasło musi mieć min. 6 znaków.'); return;
  }
  if (pass !== pass2) {
    alertEl.innerHTML = err('Hasła się nie zgadzają.'); return;
  }

  btn.textContent = 'Zapisywanie…'; btn.disabled = true;

  const { error } = await _supabase.auth.updateUser({ password: pass });

  if (error) {
    alertEl.innerHTML = err('Coś poszło nie tak. Spróbuj ponownie.');
    btn.textContent = 'Zapisz nowe hasło →'; btn.disabled = false;
  } else {
    document.getElementById('form-area').style.display = 'none';
    alertEl.innerHTML = `<div class="alert alert-success" style="margin-bottom:20px">
      ✓ Hasło zostało zmienione. <a href="dashboard.html" style="color:var(--orange2)">Przejdź do panelu →</a>
    </div>`;
  }
}

function err(msg) {
  return `<div class="alert alert-danger" style="margin-bottom:16px">${msg}</div>`;
}
</script>
</body>
</html>
